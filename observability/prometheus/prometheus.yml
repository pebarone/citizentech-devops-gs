global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # MVP publicado na Azure (HTTPS + token Bearer em /metrics).
  - job_name: citizentech-prod
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus-secrets/metrics_token
    file_sd_configs:
      - files: ["/etc/prometheus/targets/prod.yml"]

  # Stack local (docker compose up na raiz do repositório), para testar antes do deploy.
  - job_name: citizentech-local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          env: local
