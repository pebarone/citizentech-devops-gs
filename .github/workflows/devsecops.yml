name: DevSecOps

# A cada push e PR: segredos (Gitleaks), SAST (Semgrep), testes, build e scan da imagem (Trivy).
# Só em push na main, e só se tudo acima passar: publica a imagem no GHCR e faz o deploy na VM.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Na main nunca cancela: um push novo não pode interromper um deploy em andamento.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_VERSION: "8.21.2"
  SEMGREP_VERSION: "1.183.0"
  # Fixado por digest: tags podem ser repontadas (ataque de supply chain às tags do Trivy em 2026).
  TRIVY_IMAGE: "aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7"
  # Espelho do banco de vulnerabilidades: evita o TOOMANYREQUESTS do ghcr.io em runners compartilhados.
  TRIVY_DB_REPOSITORY: "mirror.gcr.io/aquasec/trivy-db"

jobs:
  gitleaks:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Varrer os commits novos
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Varre só os commits que este push/PR traz. Um segredo removido num commit
          # posterior continua no histórico e deve ser revogado, mesmo depois de o pipeline voltar ao verde.
          if [ -n "$BASE_SHA" ]; then
            RANGE="${BASE_SHA}..${GITHUB_SHA}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="${BEFORE}..${GITHUB_SHA}"
          else
            RANGE=""
          fi
          echo "Intervalo: ${RANGE:-histórico completo}"
          gitleaks detect --source . --redact --verbose --exit-code 1 ${RANGE:+--log-opts="$RANGE"}

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Rodar Semgrep
        run: |
          semgrep scan \
            --config p/python \
            --config p/dockerfile \
            --config p/terraform \
            --config p/github-actions \
            --config p/secrets \
            --metrics=off \
            --error

  test:
    name: Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  build:
    name: Build + Trivy
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, test, terraform]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Nome da imagem
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}/api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build -t "${{ steps.meta.outputs.image }}" app

      - name: Trivy - vulnerabilidades da imagem (bloqueia HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --db-repository "$TRIVY_DB_REPOSITORY" \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            "${{ steps.meta.outputs.image }}"

      - name: Trivy - misconfig de Dockerfile e Terraform (relatório)
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" config \
            --exit-code 0 --severity MEDIUM,HIGH,CRITICAL /src

      - name: Publicar no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"

  deploy:
    name: Deploy na Azure
    runs-on: ubuntu-latest
    needs: [build]
    # Só depois do terraform apply: enquanto a variável AZURE_VM_NAME não existir, o deploy é pulado.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_VM_NAME != ''
    environment:
      name: production
      url: ${{ vars.MVP_URL }}
    permissions:
      contents: read
      id-token: write   # OIDC: troca o token do GitHub por um token Azure, sem senha guardada
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Login na Azure (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Atualizar a stack na VM (Run Command, sem SSH)
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM: ${{ vars.AZURE_VM_NAME }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          script="curl -fsSL --retry 3 -o /tmp/deploy.sh https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/deploy/deploy.sh && bash /tmp/deploy.sh '${GITHUB_REPOSITORY}' '${GITHUB_SHA}' '${IMAGE}'"
          out=$(az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript \
                --scripts "$script" --query "value[0].message" -o tsv)
          echo "$out"
          # O Run Command não propaga o exit code do script: conferimos a marca de sucesso.
          echo "$out" | grep -q "deploy ok:"

      - name: Smoke test na URL pública
        env:
          MVP_URL: ${{ vars.MVP_URL }}
        run: |
          for i in $(seq 1 12); do
            version=$(curl -fsS "${MVP_URL}/api/v1/info" | jq -r .version) || true
            if [ "$version" = "$GITHUB_SHA" ]; then echo "No ar: $MVP_URL ($version)"; exit 0; fi
            sleep 10
          done
          echo "A URL pública não respondeu com a versão $GITHUB_SHA" >&2
          exit 1
